version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
  file:
    class: logging.FileHandler
    filename: logs/lca_system.log
    formatter: standard
    level: DEBUG
loggers:
  LCASystem:
    handlers: [console, file]
    level: DEBUG
    propagate: false
