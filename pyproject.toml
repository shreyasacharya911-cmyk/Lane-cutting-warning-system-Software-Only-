[project]
name = "lane-cut-assist"
version = "0.1.0"
description = "Warning-only Lane Cut Assist (LCA) ADAS system for two-wheelers"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^build/", "^dist/"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__", ".mypy_cache", ".pytest_cache"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
